<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Validación de Certificado - Cabildo Muisca de Bosa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-dark text-white">
        <h4>Cabildo Muisca de Bosa - Validación de Certificado</h4>
      </div>
      <div class="card-body text-center">
        <h5 class="mb-3">Resultado de Validación</h5>
        <div id="resultado" class="fs-4 fw-bold"></div>
      </div>
      <div class="card-footer text-muted text-center">
        Escaneado desde QR o ingresando el hash en la URL
      </div>
    </div>
  </div>

  <script>
    async function validar() {
      const urlParams = new URLSearchParams(window.location.search);
      const hash = urlParams.get("hash");
      const resultado = document.getElementById("resultado");

      if (!hash) {
        resultado.textContent = "⚠️ No se proporcionó ningún hash";
        resultado.className = "text-warning fs-4 fw-bold";
        return;
      }

      try {
        const res = await fetch("validos.json");
        if (!res.ok) throw new Error("No se pudo cargar la lista de certificados");

        const data = await res.json();
        const registro = (data.hashes_validos || []).find(item => item.hash === hash);

        if (registro) {
          const fechaEmision = new Date(registro.fecha_emision);
          const hoy = new Date();
          const diferenciaDias = (hoy - fechaEmision) / (1000 * 60 * 60 * 24);

          // Hasta 60 días: Certificado Vigente
          if (diferenciaDias <= 60) {
            resultado.textContent = "✅ Certificado válido (vigente)";
            resultado.className = "text-success fs-4 fw-bold";
          } 
          // Entre 61 y 80 días: Certificado Vencido
          else {
            resultado.textContent = "⚠️ Certificado vencido (superó los 60 días)";
            resultado.className = "text-warning fs-4 fw-bold";
          }
        } else {
          // Más de 80 días (el backend ya lo eliminó de validos.json)
          resultado.textContent = "❌ Certificado inválido o no encontrado";
          resultado.className = "text-danger fs-4 fw-bold";
        }
      } catch (error) {
        resultado.textContent = "Error al cargar la lista de certificados";
        resultado.className = "text-danger fs-4 fw-bold";
      }
    }
    validar();
  </script>
</body>
</html>
