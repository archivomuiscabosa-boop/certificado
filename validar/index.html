<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación de Certificado - Cabildo Muisca de Bosa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow border-0">
          <div class="card-header bg-dark text-white text-center py-3">
            <h5 class="mb-0">Cabildo Indígena Muisca de Bosa</h5>
            <small class="text-white-50">Sistema de Validación de Certificados</small>
          </div>
          <div class="card-body text-center p-4">
            <h6 class="text-muted mb-3">Resultado de la Verificación</h6>
            <div id="resultado" class="fs-4 fw-bold mb-3">
              <span class="spinner-border spinner-border-sm text-primary" role="status"></span> Validando...
            </div>
            <div id="detalles" class="text-start small bg-body-tertiary p-3 rounded d-none">
              <p class="mb-1"><strong>Fecha de Emisión:</strong> <span id="fechaEmision"></span></p>
              <p class="mb-0"><strong>Hash:</strong> <span id="hashTexto" class="text-break font-monospace"></span></p>
            </div>
          </div>
          <div class="card-footer text-muted text-center small py-2">
            Verificación oficial en línea mediante código QR
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function validar() {
      const urlParams = new URLSearchParams(window.location.search);
      const hash = urlParams.get("hash");
      const resultado = document.getElementById("resultado");
      const detalles = document.getElementById("detalles");
      const fechaEmisionElem = document.getElementById("fechaEmision");
      const hashTextoElem = document.getElementById("hashTexto");

      if (!hash) {
        resultado.textContent = "⚠️ No se proporcionó ningún hash de verificación.";
        resultado.className = "text-warning fs-5 fw-bold";
        return;
      }

      try {
        // Evita lecturas en caché de GitHub Pages
        const res = await fetch("../validos.json", { cache: "no-cache" });
        if (!res.ok) throw new Error("No se pudo cargar la base de datos de certificados.");

        const data = await res.json();
        const registro = data.hashes_validos.find(item => item.hash === hash);

        if (registro) {
          const fechaEmision = new Date(registro.fecha_emision + "T00:00:00");
          const hoy = new Date();
          
          // Cálculo de diferencia en días
          const diferenciaTiempo = hoy - fechaEmision;
          const diferenciaDias = Math.floor(diferenciaTiempo / (1000 * 60 * 60 * 24));

          detalles.classList.remove("d-none");
          fechaEmisionElem.textContent = registro.fecha_emision;
          hashTextoElem.textContent = hash;

          // Vigencia institucional de 60 días
          if (diferenciaDias <= 60 && diferenciaDias >= 0) {
            resultado.textContent = "✅ CERTIFICADO VÁLIDO Y VIGENTE";
            resultado.className = "text-success fs-4 fw-bold";
          } else {
            resultado.textContent = "⚠️ CERTIFICADO VENCIDO (Superó los 60 días de vigencia)";
            resultado.className = "text-warning fs-5 fw-bold";
          }
        } else {
          resultado.textContent = "❌ CERTIFICADO NO ENCONTRADO O INVÁLIDO";
          resultado.className = "text-danger fs-4 fw-bold";
        }
      } catch (error) {
        resultado.textContent = "❌ Error al verificar el certificado.";
        resultado.className = "text-danger fs-5 fw-bold";
      }
    }

    validar();
  </script>
</body>
</html>
