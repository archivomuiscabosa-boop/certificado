<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Validación de Certificado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow">
      <div class="card-header bg-dark text-white">
        <h4>Cabildo Muisca de Bosa - Validación de Certificado</h4>
      </div>
      <div class="card-body text-center">
        <h5 class="mb-3">Resultado de Validación</h5>
        <div id="resultado" class="fs-4 fw-bold"></div>
      </div>
      <div class="card-footer text-muted text-center">
        Escaneado desde QR o ingresando el hash en la URL
      </div>
    </div>
  </div>

  <script>
    async function validar() {
      const urlParams = new URLSearchParams(window.location.search);
      const hash = urlParams.get("hash");
      const resultado = document.getElementById("resultado");

      if (!hash) {
        resultado.textContent = "⚠️ No se proporcionó ningún hash";
        resultado.className = "text-warning fs-4 fw-bold";
        return;
      }

      try {
        const res = await fetch("../validos.json");
        const data = await res.json();

        // Buscar el hash en el archivo
        const registro = data.hashes_validos.find(item => item.hash === hash);

        if (registro) {
          const fechaEmision = new Date(registro.fecha_emision);
          const hoy = new Date();
          const diferenciaDias = (hoy - fechaEmision) / (1000 * 60 * 60 * 24);

          if (diferenciaDias <= 2) {
            resultado.textContent = "✅ Certificado válido (vigente)";
            resultado.className = "text-success fs-4 fw-bold";
          } else {
            resultado.textContent = "⚠️ Certificado vencido (más de 2 días)";
            resultado.className = "text-warning fs-4 fw-bold";
          }
        } else {
          resultado.textContent = "❌ Certificado inválido";
          resultado.className = "text-danger fs-4 fw-bold";
        }
      } catch (error) {
        resultado.textContent = "Error al cargar lista de certificados";
        resultado.className = "text-danger fs-4 fw-bold";
      }
    }
    validar();
  </script>
</body>
</html>
